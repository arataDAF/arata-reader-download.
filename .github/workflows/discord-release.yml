name: Announce release on Discord

on:
  workflow_dispatch:
  release:
    types: [published]

permissions: {}

jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Post ArataReader update
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ROLE_ID: ${{ vars.DISCORD_ROLE_ID }}
          DISCORD_ICON_URL: ${{ vars.DISCORD_ICON_URL }}
          DISCORD_BANNER_URL: ${{ vars.DISCORD_BANNER_URL }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          
          async function main() {
            const isTest = process.env.GITHUB_EVENT_NAME === 'workflow_dispatch';
            const release = isTest ? {
              name: 'ArataReader — TEST announcement',
              tag_name: 'TEST',
              html_url: 'https://github.com/arataDAF/arata-reader-download./releases/latest',
              body: '**This is a test. No new app version was published.**\n\n**Added (1)**\n```\n[+] Automatic Discord release announcements\n```\n\n**Fixed (1)**\n```\n[~] Example fix: smoother chapter loading\n```\n\n**Removed (1)**\n```\n[-] Example: outdated reader option\n```',
              published_at: new Date().toISOString(),
              assets: [],
            } : JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8')).release;
            if (!release || release.draft) throw new Error('Expected a published release.');
            const webhook = process.env.DISCORD_WEBHOOK_URL;
            if (!webhook) throw new Error('Add the DISCORD_WEBHOOK_URL repository Actions secret.');
            const endpoint = new URL(webhook);
            if (endpoint.protocol !== 'https:' || endpoint.hostname !== 'discord.com' ||
                !/^\/api(?:\/v\d+)?\/webhooks\/\d+\/[^/]+$/.test(endpoint.pathname)) {
              throw new Error('DISCORD_WEBHOOK_URL must be a Discord webhook URL.');
            }
            endpoint.searchParams.set('wait', 'true');
            const clip = (text, max) => text.length > max ? text.slice(0, max - 1) + '…' : text;
            const role = isTest ? '' : (process.env.DISCORD_ROLE_ID || '');
            if (role && !/^\d+$/.test(role)) throw new Error('DISCORD_ROLE_ID must contain only the role ID.');
            const name = clip(release.name || release.tag_name, 220);
            const embed = {
              title: '📚 ' + name,
              url: release.html_url,
              color: 0x8B5CF6,
              description: clip(release.body?.trim() || 'A new ArataReader update is available.', 3500),
              fields: [
                { name: 'Version', value: clip(release.tag_name, 100), inline: true },
                { name: 'How to update', value: 'Open ArataReader and check for updates in the app.' },
                { name: '⏳ Update availability', value: 'Please allow 30 minutes to 1 hour for the update to appear in ArataReader.' },
              ],
              footer: { text: 'ArataReader • Update log' },
              timestamp: release.published_at,
            };
            const payload = {
              username: 'ArataReader Updates',
              allowed_mentions: { parse: [], roles: role ? [role] : [] },
              embeds: [embed],
            };
            if (role) payload.content = '<@&' + role + '>';
            for (const [variable, field] of [
              ['DISCORD_ICON_URL', 'thumbnail'],
              ['DISCORD_BANNER_URL', 'image'],
            ]) {
              const defaults = {
                DISCORD_ICON_URL: 'https://raw.githubusercontent.com/arataDAF/arata-reader-download./main/.github/assets/logo-violet.png',
                DISCORD_BANNER_URL: 'https://raw.githubusercontent.com/arataDAF/arata-reader-download./main/.github/assets/update-log-motion.gif',
              };
              const value = process.env[variable] || defaults[variable];
              if (!value) continue;
              const url = new URL(value);
              if (url.protocol !== 'https:') throw new Error(variable + ' must be a public HTTPS image URL.');
              embed[field] = { url: value };
              if (field === 'thumbnail') {
                payload.avatar_url = value;
                embed.footer.icon_url = value;
              }
            }
            const headers = {};
            let body;
            if (!process.env.DISCORD_BANNER_URL) {
              const bannerResponse = await fetch(embed.image.url, {
                signal: AbortSignal.timeout(30000),
              });
              if (!bannerResponse.ok) throw new Error('Banner download failed.');
              const bannerBytes = await bannerResponse.arrayBuffer();
              const signature = new TextDecoder().decode(bannerBytes.slice(0, 6));
              if (!['GIF87a', 'GIF89a'].includes(signature) || bannerBytes.byteLength > 9500000) {
                throw new Error('Banner must be a GIF smaller than 9.5 MB.');
              }
              embed.image = { url: 'attachment://arata-update-log.gif' };
              payload.attachments = [{ id: 0, filename: 'arata-update-log.gif' }];
              body = new FormData();
              body.set('payload_json', JSON.stringify(payload));
              body.set('files[0]', new Blob([bannerBytes], { type: 'image/gif' }), 'arata-update-log.gif');
            } else {
              headers['Content-Type'] = 'application/json';
              body = JSON.stringify(payload);
            }
            const response = await fetch(endpoint, {
              method: 'POST',
              headers,
              body,
              signal: AbortSignal.timeout(30000),
            });
            if (!response.ok) throw new Error('Discord rejected the announcement (HTTP ' + response.status + ').');
            const posted = await response.json();
            console.log('Discord release announcement sent. Message ID: ' + posted.id);
            console.log('Banner attached: ' + Boolean(posted.attachments?.length));
          }
          
          main().catch(() => {
            // Network errors can contain the secret webhook URL.
            console.error('Announcement failed. Check the webhook secret, optional variables, and Discord availability.');
            process.exitCode = 1;
          });
          NODE
